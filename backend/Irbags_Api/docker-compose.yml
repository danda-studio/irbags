
    services:
      db:
        image: postgres:15
        restart: unless-stopped
        environment:
          POSTGRES_USER: ${DB_USER_STAGING}
          POSTGRES_PASSWORD: ${DB_PASS_STAGING}
          POSTGRES_DB: ${DB_NAME_STAGING}
        ports:
          - "5433:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        networks:
          - irbags_net

      api:
        build:
          context: .
          dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
          - db
        environment:
          Host: ${DB_HOST_STAGING}
          Port: ${DB_PORT_STAGING}
          Database: ${DB_NAME_STAGING}
          Username: ${DB_USER_STAGING}
          Password: ${DB_PASS_STAGING}
          ASPNETCORE_ENVIRONMENT: Development
        ports:
          - "5000:8080"
        networks:
          - irbags_net

    volumes:
      pgdata:

    networks:
      irbags_net:
        driver: bridge

