name: Release IRBAGS UI Kit Alpha

on:
  push:
    branches:
      - feature/c3xFbH6m
    paths:
      - "frontend/ui-kit/**"

permissions:
  contents: write

jobs:
  release-irbags-ui_kit-alpha:
    runs-on: ubuntu-latest
    environment: develop/frontend/ui-kit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend/ui-kit

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Nuxt project
        run: pnpm run dev:prepare
        working-directory: frontend/ui-kit

      - name: Release alpha version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:alpha
        working-directory: frontend/ui-kit

      - name: Commit new version bump
        run: git commit -m "New Version"

      - name: Push version bump
        run: git push
