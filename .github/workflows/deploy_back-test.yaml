name: CI/CD Docker Staging (Backend)

on:
  push:
    branches: 
      - develop 
    paths:
      - "backend/**"
      - ".github/workflows/deploy_back-test.yaml"

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Irbags_Api
          file: ./backend/Irbags_Api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/irbags_api:staging

      - name: Deploy on staging server
        shell: powershell
        run: |
          try {
            Set-Location ./backend/Irbags_Api
            
            Write-Host "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/irbags_api:staging
            
            # Создаём .env файл с переменными окружения
            Write-Host "Creating .env file..."
            @"
            DB_USER_STAGING=${{ secrets.DB_USER_STAGING }}
            DB_PASS_STAGING=${{ secrets.DB_PASS_STAGING }}
            DB_NAME_STAGING=${{ secrets.DB_NAME_STAGING }}
            DB_HOST_STAGING=${{ secrets.DB_HOST_STAGING }}
            DB_PORT_STAGING=${{ secrets.DB_PORT_STAGING }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            "@ | Out-File -FilePath .env -Encoding UTF8
            
            Write-Host "Stopping old containers..."
            docker compose down
            
            Write-Host "Starting new containers..."
            docker compose --env-file .env up -d
            
            Write-Host "Waiting for services to be ready..."
            Start-Sleep -Seconds 10
            
            Write-Host "Containers status:"
            docker compose ps
            
            Write-Host "Checking logs..."
            docker compose logs api --tail=20
            
          } catch {
            Write-Error "Deployment failed: $_"
            docker compose logs
            exit 1
          }
